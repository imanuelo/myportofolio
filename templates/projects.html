{% extends 'base.html' %}

{% block content %}

<main class="page-section">
    <section id="projects">
        <div class="container">

            <div class="page-header">
                <p class="section-kicker">My work so far</p>
                <h1>Projects</h1>
            </div>

            <div class="card-grid">
                {% for project in project_list %}
                    <article class="card">

                        {% load static %}
                        <img
                            src="{% static project.thumbnail %}"
                            alt="{{ project.title }}"
                        >

                        <span class="card-category">
                            {{ project.category }}
                        </span>

                        <h2>{{ project.title }}</h2>

                        <p class="card-description">
                            {{ project.description }}
                        </p>
                    </article>

                {% empty %}
                    <p class="empty-state">
                        No projects have been added yet.
                    </p>
                {% endfor %}
            </div>
        </div>
    </section>
</main>

{% endblock content %}
